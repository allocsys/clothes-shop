name: CI

# Runs on every push to main, on pull requests, and by hand (Actions tab -> CI -> Run workflow).
# 1) build-and-test: installs, builds, typechecks, applies migrations to a throw-away Postgres,
#    starts the real server and runs scripts/smoke.sh against it.
# 2) docker-image: builds the production Docker image (the VPS deploy route).
#
# Speed: the jobs run in parallel, so the total time is the slowest job. Each job restores caches
# (npm downloads, Next.js build cache, Playwright browsers, Docker layers) so installs, builds and
# downloads are mostly skipped. The first run after a cache key changes is slower while it fills the cache.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shop
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/shop
      ADMIN_PASSWORD: ci-test-password-123
      UPLOAD_DIR: /tmp/uploads
      SITE_URL: https://shop.example.test
      SMS_PROVIDER: mock
      ALLOW_MOCK_SMS: '1'
      PAYMENT_PROVIDER: mock
      ALLOW_MOCK_PAYMENT: '1'
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # No package-lock.json is committed on purpose, so the npm cache is keyed on package.json.
      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package.json', 'e2e/package.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Cache Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package.json') }}-${{ hashFiles('app/**', 'components/**', 'lib/**', 'data/**', 'next.config.*', 'tailwind.config.*') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('package.json') }}-
            next-${{ runner.os }}-

      - name: Install dependencies
        run: npm install --no-audit --no-fund --prefer-offline

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Migrate and seed the test database
        run: |
          npm run db:migrate
          npm run db:migrate   # second run must be a harmless no-op
          npm run db:seed

      - name: Start the server
        run: |
          nohup npx next start -p 3100 > next.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -s -o /dev/null http://localhost:3100/; then echo "server is up"; exit 0; fi
            sleep 2
          done
          echo "server did not start"
          cat next.log
          exit 1

      - name: Smoke test
        run: bash scripts/smoke.sh http://localhost:3100

      - name: Server log (on failure)
        if: failure()
        run: tail -n 150 next.log || true

  docker-image:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Layers (base image, npm install) are cached between runs; only changed layers rebuild.
      - name: Build the production image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: mahpari-shop:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 3) phone-checks: opens the running shop in a real browser at phone size (390x844) and checks
  #    sideways overflow, tap-target sizes, accessible names and server errors (e2e/phone-check.mjs).
  phone-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shop
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/shop
      ADMIN_PASSWORD: ci-test-password-123
      UPLOAD_DIR: /tmp/uploads
      SITE_URL: https://shop.example.test
      SMS_PROVIDER: mock
      ALLOW_MOCK_SMS: '1'
      PAYMENT_PROVIDER: mock
      ALLOW_MOCK_PAYMENT: '1'
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package.json', 'e2e/package.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Cache Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package.json') }}-${{ hashFiles('app/**', 'components/**', 'lib/**', 'data/**', 'next.config.*', 'tailwind.config.*') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('package.json') }}-
            next-${{ runner.os }}-

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package.json') }}

      - name: Install dependencies
        run: npm install --no-audit --no-fund --prefer-offline

      - name: Build
        run: npm run build

      - name: Migrate and seed the test database
        run: |
          npm run db:migrate
          npm run db:seed

      - name: Start the server
        run: |
          nohup npx next start -p 3100 > next.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -s -o /dev/null http://localhost:3100/; then echo "server is up"; exit 0; fi
            sleep 2
          done
          echo "server did not start"
          cat next.log
          exit 1

      - name: Install Playwright and Chromium
        working-directory: e2e
        run: |
          npm install --no-audit --no-fund --prefer-offline
          npx playwright install --with-deps chromium

      - name: Phone-size checks
        working-directory: e2e
        run: node phone-check.mjs http://localhost:3100

      - name: Server log (on failure)
        if: failure()
        run: tail -n 100 next.log || true

  # 4) flow-checks: the purchase flow in a phone-size browser with the mock gateway and mock SMS:
  #    checkout, payment OK / cancel, tracking, SMS login, order history, admin (e2e/flow-check.mjs).
  flow-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shop
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/shop
      ADMIN_PASSWORD: ci-test-password-123
      UPLOAD_DIR: /tmp/uploads
      SITE_URL: http://localhost:3100
      SMS_PROVIDER: mock
      ALLOW_MOCK_SMS: '1'
      PAYMENT_PROVIDER: mock
      ALLOW_MOCK_PAYMENT: '1'
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package.json', 'e2e/package.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Cache Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package.json') }}-${{ hashFiles('app/**', 'components/**', 'lib/**', 'data/**', 'next.config.*', 'tailwind.config.*') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('package.json') }}-
            next-${{ runner.os }}-

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package.json') }}

      - name: Install dependencies
        run: npm install --no-audit --no-fund --prefer-offline

      - name: Build
        run: npm run build

      - name: Migrate and seed the test database
        run: |
          npm run db:migrate
          npm run db:seed

      - name: Start the server
        run: |
          nohup npx next start -p 3100 > next.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -s -o /dev/null http://localhost:3100/; then echo "server is up"; exit 0; fi
            sleep 2
          done
          echo "server did not start"
          cat next.log
          exit 1

      - name: Install Playwright and Chromium
        working-directory: e2e
        run: |
          npm install --no-audit --no-fund --prefer-offline
          npx playwright install --with-deps chromium

      - name: Purchase-flow checks
        working-directory: e2e
        env:
          NEXT_LOG: ../next.log
        run: node flow-check.mjs http://localhost:3100

      - name: Server log (on failure)
        if: failure()
        run: tail -n 100 next.log || true

  # 5) lighthouse: mobile performance, accessibility, best-practices and SEO scores of the main pages
  #    (report only for now, it never fails the build; summary in the job log and the run summary).
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shop
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/shop
      ADMIN_PASSWORD: ci-test-password-123
      UPLOAD_DIR: /tmp/uploads
      SITE_URL: http://localhost:3100
      SMS_PROVIDER: mock
      ALLOW_MOCK_SMS: '1'
      PAYMENT_PROVIDER: mock
      ALLOW_MOCK_PAYMENT: '1'
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package.json', 'e2e/package.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Cache Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package.json') }}-${{ hashFiles('app/**', 'components/**', 'lib/**', 'data/**', 'next.config.*', 'tailwind.config.*') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('package.json') }}-
            next-${{ runner.os }}-

      - name: Install dependencies
        run: npm install --no-audit --no-fund --prefer-offline

      - name: Build
        run: npm run build

      - name: Migrate and seed the test database
        run: |
          npm run db:migrate
          npm run db:seed

      - name: Start the server
        run: |
          nohup npx next start -p 3100 > next.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -s -o /dev/null http://localhost:3100/; then echo "server is up"; exit 0; fi
            sleep 2
          done
          echo "server did not start"
          cat next.log
          exit 1

      # The Lighthouse package is downloaded once (then served from the npm cache for the other pages).
      - name: Run Lighthouse (mobile)
        run: |
          mkdir lh && cd lh
          i=0
          for p in / /shop /product/sample-manteau-1 /cart; do
            i=$((i+1))
            npx --yes lighthouse@12.6.1 "http://localhost:3100$p" --quiet \
              --only-categories=performance,accessibility,best-practices,seo \
              --chrome-flags="--headless=new --no-sandbox" \
              --output=json --output-path="./lh-$i.json" || echo "lighthouse failed for $p"
          done

      - name: Lighthouse summary
        working-directory: lh
        run: node ../scripts/lh-report.mjs

      - name: Server log (on failure)
        if: failure()
        run: tail -n 100 next.log || true
